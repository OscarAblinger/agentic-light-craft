plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.

    // Modrinth Maven serves the files of published Modrinth versions as
    // "maven.modrinth:<project-slug>:<version-id>", where the version ID is the last path
    // segment of the version's page URL, e.g. https://modrinth.com/mod/jei/version/7qmEzno8
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }

    // Curse Maven serves CurseForge files as "curse.maven:<project-id>:<file-id>".
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.1.2, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Runs the client with additional mods, to play against runServerModpack with the same
        // mods in place. Both *Modpack runs share the run-modpack game directory, so they always
        // load the same mods; declare them in the `modpackMods` configuration below. The shared
        // directory keeps these runs separate from runClient/runServer.
        clientModpack {
            client()
            gameDirectory = project.file('run-modpack')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Starts a dedicated server with additional mods, to test LightCraft in a modpack-like
        // setup. It shares the run-modpack game directory (and therefore all mods) with
        // runClientModpack; declare the mods in the `modpackMods` configuration below. On the
        // first launch the server stops once for the EULA prompt; set "eula=true" in
        // run-modpack/eula.txt and start it again.
        serverModpack {
            server()
            programArgument '--nogui'
            gameDirectory = project.file('run-modpack')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // Plain JVM unit tests (src/test) run on the game classpath so they can reference
    // Minecraft classes; the tested mod is loaded into the test JVM. Placed after the
    // mods block because testedMod refers to the mod registered above.
    unitTest {
        enable()
        testedMod = mods.lightcraft
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime

    // Mods that are only loaded by the *Modpack runs: declare their Maven coordinates in the
    // `dependencies` block below. Following Gradle's configuration role model, the dependencies
    // are declared on the `modpackMods` dependency scope, while `modpackModsClasspath` is the
    // configuration that the syncModpackMods task resolves and copies into the mods folder of
    // the shared run-modpack game directory.
    def modpackMods = dependencyScope('modpackMods')
    resolvable('modpackModsClasspath') { extendsFrom(modpackMods) }
}

dependencies {
    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html

    // Mods for the *Modpack runs, downloaded and copied into run-modpack/mods by Gradle (see the
    // modpackMods configuration above and the syncModpackMods task below).
    // Pin the version ID/file ID: most mods share one version number across mod loaders and
    // Minecraft versions, which is ambiguous in Maven. Transitive dependencies are disabled so
    // that only the published mod jars themselves end up in the mods folder.
    modpackMods('maven.modrinth:jei:7qmEzno8') { transitive = false } // JEI 29.47.0.110 for NeoForge 26.1.2
    modpackMods('maven.modrinth:mezzconfig:ZK7XIgVN') { transitive = false } // MezzConfig 0.6.8, required by JEI
    modpackMods('maven.modrinth:journeymap:9CsaQLo2') { transitive = false } // JourneyMap 26.1.2-6.0.10 for NeoForge 26.1.2
    // CurseForge files are addressed by project ID and file ID: the file ID is the number in the
    // file's URL (curseforge.com/minecraft/mc-mods/<slug>/files/<file-id>), the project ID is
    // shown as "Project ID" on the project page.
    modpackMods('curse.maven:ftb-ultimine-386134:9205003') { transitive = false } // FTB Ultimine 26.1.2.6
    modpackMods('curse.maven:ftb-library-404465:9008066') { transitive = false } // FTB Library 26.1.2.9, required by FTB Ultimine

    // Unit tests (src/test) with JUnit 5; concrete versions come from the BOM.
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Downloads the mods listed in the `modpackMods` dependency scope and copies them into
// run-modpack/mods/, the mods folder shared by both *Modpack runs. Both runs depend on this
// task, so starting them downloads the mods automatically; run `syncModpackMods` on its own to
// update the folder without launching the game. Mods are copied under a stable name: the version
// ID/file ID (and, for CurseMaven, the project ID) suffix is stripped, so changing a version
// above replaces the jar instead of leaving an old duplicate behind. Jars that you drop into the
// folder yourself are never touched; `cleanModpackMods` empties the folder.
def syncModpackMods = tasks.register('syncModpackMods', Copy) {
    group = 'mod development'
    description = 'Copies the mods from the modpackMods configuration into run-modpack/mods.'
    into layout.projectDirectory.dir('run-modpack/mods')
    from(configurations.modpackModsClasspath) {
        // "<slug>-<version-id>.jar" (Modrinth) or "<name>-<project-id>-<file-id>.jar" (CurseMaven)
        // both become "<name>.jar".
        rename { name ->
            def strippedCurseMavenSuffix = name.replaceFirst(/-\d+-\d+\.jar$/, '.jar')
            strippedCurseMavenSuffix == name ? strippedCurseMavenSuffix.replaceFirst(/-[A-Za-z0-9]{8}\.jar$/, '.jar') : strippedCurseMavenSuffix
        }
    }
}

tasks.register('cleanModpackMods', Delete) {
    group = 'mod development'
    description = 'Deletes the mods from the shared modpack run game directory.'
    delete layout.projectDirectory.dir('run-modpack/mods')
}

tasks.named('runServerModpack') { dependsOn syncModpackMods }
tasks.named('runClientModpack') { dependsOn syncModpackMods }

// Run the unit tests on the JUnit platform, as part of `check` and therefore `build`.
test {
    useJUnitPlatform()
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
